# Optional containerized stack. Local dev works fine without Docker (see README) —
# use this when you want Postgres instead of SQLite, or a portable deployable bundle.
#
#   docker compose --profile postgres up --build     # backend + Postgres
#   docker compose up --build                         # backend only (still uses SQLite unless
#                                                       # DATABASE_URL is overridden in backend/.env)

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/.env:/app/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/sevakai.db}

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: sevakai
      POSTGRES_USER: sevakai
      POSTGRES_PASSWORD: sevakai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
